name: Deploy Backend to Azure

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# GITHUB_TOKEN needs package-write to push to GHCR; contents:read for checkout.
permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/aayush412/buildestate-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          # SHA tag guarantees the App Service sees a config change and
          # actually pulls + restarts; :latest alone is a no-op redeploy.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
